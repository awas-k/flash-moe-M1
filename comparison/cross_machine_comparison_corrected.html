<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flash-MoE — Cross-Machine Comparison</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; padding: 24px; background: #fff; color: #1a1a1a; }
  @media (prefers-color-scheme: dark) { body { background: #1a1a1a; color: #e0e0e0; } }
  .legend { display: flex; flex-wrap: wrap; gap: 16px; margin: 8px 0 0; font-size: 12px; color: #73726c; }
  @media (prefers-color-scheme: dark) { .legend { color: #9c9a92; } }
  .legend span { display: flex; align-items: center; gap: 4px; }
  .dot { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .section { margin-bottom: 2rem; }
</style>
</head>
<body>

<div class="section">
  <div style="position: relative; width: 100%; height: 280px;">
    <canvas id="crossChart"></canvas>
  </div>
  <div class="legend">
    <span><span class="dot" style="background: #378ADD;"></span>M1 Pro 16 GB (your machine)</span>
    <span><span class="dot" style="background: #5DCAA5;"></span>M4 Mac mini 16 GB (reference)</span>
    <span><span class="dot" style="background: #888780;"></span>M3 Max 48 GB (original)</span>
  </div>
</div>

<div class="section">
  <div style="position: relative; width: 100%; height: 220px;">
    <canvas id="ttftChart"></canvas>
  </div>
  <div class="legend">
    <span><span class="dot" style="background: #378ADD;"></span>M1 Pro (optimized)</span>
    <span><span class="dot" style="background: #5DCAA5;"></span>M4 mini</span>
    <span><span class="dot" style="background: #888780;"></span>M3 Max</span>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
var isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
var gridColor = isDark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.06)';
var labelColor = isDark ? '#9c9a92' : '#73726c';

new Chart(document.getElementById('crossChart'), {
  type: 'bar',
  data: {
    labels: [
      'M3 Max 48 GB\nK=4 (original)',
      'M1 Pro 16 GB\nK=4 (before)',
      'M4 mini 16 GB\nK=6 (tayoun)',
      'M1 Pro 16 GB\nK=4 (tg256)',
    ],
    datasets: [{
      data: [4.4, 9.16, 11.5, 11.91],
      backgroundColor: ['#888780', '#85B7EB', '#5DCAA5', '#378ADD'],
      borderRadius: 4,
    }]
  },
  options: {
    indexAxis: 'y',
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { display: false },
      title: {
        display: true,
        text: 'Sustained tok/s — quality-verified configs only',
        color: labelColor,
        font: { size: 14, weight: '500' }
      },
    },
    scales: {
      x: { beginAtZero: true, max: 14, ticks: { color: labelColor, callback: function(v) { return v + ' tok/s'; } }, grid: { color: gridColor } },
      y: { ticks: { color: labelColor, font: { size: 12 } }, grid: { display: false } }
    }
  }
});

new Chart(document.getElementById('ttftChart'), {
  type: 'bar',
  data: {
    labels: [
      'M3 Max 48 GB',
      'M4 mini 16 GB',
      'M1 Pro 16 GB (before)',
      'M1 Pro 16 GB (tg256)',
    ],
    datasets: [{
      data: [5.6, 2.5, 2.39, 1.71],
      backgroundColor: ['#888780', '#5DCAA5', '#85B7EB', '#378ADD'],
      borderRadius: 4,
    }]
  },
  options: {
    indexAxis: 'y',
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { display: false },
      title: {
        display: true,
        text: 'Time to first token (lower is better)',
        color: labelColor,
        font: { size: 14, weight: '500' }
      },
    },
    scales: {
      x: { beginAtZero: true, max: 7, ticks: { color: labelColor, callback: function(v) { return v + 's'; } }, grid: { color: gridColor } },
      y: { ticks: { color: labelColor, font: { size: 12 } }, grid: { display: false } }
    }
  }
});
</script>

</body>
</html>
