
<div style="padding: 1rem 0;">
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 1.5rem;">
  <div style="background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 1rem;">
    <div style="font-size: 13px; color: var(--color-text-secondary);">Before (K=4)</div>
    <div style="font-size: 24px; font-weight: 500;">9.16 <span style="font-size:13px;color:var(--color-text-secondary)">tok/s</span></div>
  </div>
  <div style="background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 1rem;">
    <div style="font-size: 13px; color: var(--color-text-secondary);">After tg256 (K=4)</div>
    <div style="font-size: 24px; font-weight: 500; color: var(--color-text-success);">11.91 <span style="font-size:13px">tok/s</span></div>
  </div>
  <div style="background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 1rem;">
    <div style="font-size: 13px; color: var(--color-text-secondary);">Improvement</div>
    <div style="font-size: 24px; font-weight: 500; color: var(--color-text-success);">+30%</div>
  </div>
  <div style="background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 1rem;">
    <div style="font-size: 13px; color: var(--color-text-secondary);">TTFT</div>
    <div style="font-size: 24px; font-weight: 500;">1.71s</div>
  </div>
</div>

<div style="position: relative; width: 100%; height: 320px;">
  <canvas id="expChart"></canvas>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 16px; margin: 8px 0 0; font-size: 12px; color: var(--color-text-secondary);">
  <span style="display: flex; align-items: center; gap: 4px;"><span style="width: 10px; height: 10px; border-radius: 2px; background: #5DCAA5;"></span>Kept (quality=pass all langs)</span>
  <span style="display: flex; align-items: center; gap: 4px;"><span style="width: 10px; height: 10px; border-radius: 2px; background: #F09595;"></span>Reverted / quality issue</span>
  <span style="display: flex; align-items: center; gap: 4px;"><span style="width: 10px; height: 10px; border-radius: 2px; background: #888780;"></span>Baseline</span>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const isDark = matchMedia('(prefers-color-scheme: dark)').matches;
const gridColor = isDark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.06)';
const labelColor = isDark ? '#9c9a92' : '#73726c';

new Chart(document.getElementById('expChart'), {
  type: 'bar',
  data: {
    labels: [
      'Initial baseline\nK=4 (bench.sh)',
      'Baseline sweep\nK=4 (3-run avg)',
      'Baseline sweep\nK=3 (3-run avg)',
      'Temporal prefetch\nK=4',
      'tg256 kernel\nK=4 (3-run avg)',
      'tg256 kernel\nK=3 (3-run avg)',
    ],
    datasets: [{
      data: [9.16, 10.93, 11.77, 9.64, 11.91, 12.77],
      backgroundColor: [
        '#888780',
        '#888780',
        '#EF9F27',
        '#F09595',
        '#5DCAA5',
        '#EF9F27',
      ],
      borderRadius: 4,
    }]
  },
  options: {
    responsive: true, maintainAspectRatio: false,
    plugins: {
      legend: { display: false },
      title: { display: true, text: 'Experiment results — tok/s (higher is better)', color: labelColor, font: { size: 14, weight: '500' } },
      tooltip: {
        callbacks: {
          afterBody: function(ctx) {
            const notes = [
              'First bench.sh run',
              'Proper baseline with variance',
              'Fast but Japanese quality degrades',
              '28% hit rate — SSD bandwidth waste',
              'Production config — all quality tests pass',
              'Speed king but CJK quality issues',
            ];
            return notes[ctx[0].dataIndex] || '';
          }
        }
      }
    },
    scales: {
      x: { ticks: { color: labelColor, font: { size: 11 }, autoSkip: false, maxRotation: 0 }, grid: { display: false } },
      y: { beginAtZero: true, max: 15, ticks: { color: labelColor, callback: v => v + ' t/s' }, grid: { color: gridColor } }
    }
  }
});
</script>
